name: 'Git Floating Version Tags'
description: 'Creates or updates floating version tag aliases (major, and minor when update-minor is enabled) pointing to a reference commit, extracting version information from a tag.'
author: 'LiquidLogicLabs'
inputs:
  tag:
    description: 'The tag from which to extract version information (used to determine major/minor versions). Supports tags with or without "v" prefix (e.g., "v1.2.3" or "1.2.3")'
    required: true
  ref-tag:
    description: 'The tag/commit that floating tags should point to (can be tag name, refs/tags/v1.2.3, or SHA). If not provided, uses the value from tag'
    required: false
  prefix:
    description: 'Version prefix for tag names when creating floating tags'
    required: false
    default: 'v'
  update-minor:
    description: 'Whether to update minor version tags (v1.2) alongside the major tag'
    required: false
    # Defaulted to false until v3. Every consuming repository wanted minor tags and none
    # set this, so vX.Y sat frozen at an old release everywhere while release summaries
    # claimed it had been updated. The default now matches what the README always showed.
    default: 'true'
  ignore-prerelease:
    description: 'Whether to skip prerelease versions'
    required: false
    default: 'true'
  verbose:
    description: 'Enable verbose debug logging. Also enabled when ACTIONS_STEP_DEBUG=true.'
    required: false
    default: 'false'
outputs:
  major-tag:
    description: 'The major version tag that was created/updated (e.g., "v2")'
  minor-tag:
    description: 'The minor version tag that was created/updated (e.g., "v2.3"), if update-minor is true'
runs:
  using: 'node24'
  main: 'dist/index.js'
branding:
  icon: 'tag'
  color: 'blue'
