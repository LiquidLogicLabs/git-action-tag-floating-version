name: Test

on:
  workflow_call:  # Called by CI workflow
  workflow_dispatch:  # Allow manual triggering

concurrency:
  # Explicit prefix (not ${{ github.workflow }}) so this reusable workflow does not
  # share a concurrency group with the caller (ci.yml) — caller/callee on the same
  # group with cancel-in-progress: true triggers GitHub's deadlock detection.
  group: Test-${{ github.event.pull_request.number || github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read  # Read-only (we don't actually push tags in tests)

jobs:
  test:
    # No condition here on purpose. This workflow has only workflow_call and
    # workflow_dispatch triggers, so it already cannot run any other way.
    # It previously carried:
    #   if: github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch'
    # In a reusable workflow github.event_name is the CALLER's original event, never
    # 'workflow_call'. On a push or a release tag it is 'push', so the condition was false
    # and this job skipped — and a skipped job satisfies `needs:`, so release.yml's
    # "CI and E2E must pass before release" was being satisfied by tests that never ran.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Full history for tag operations

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify Jest is installed
        run: npx jest --version

      - name: Configure git for testing
        run: |
          git config --local --replace-all user.name "Test User"
          git config --local --replace-all user.email "test@example.com"

      - name: Build action
        run: npm run build

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration